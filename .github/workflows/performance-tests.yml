---
name: Performance Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release-v*]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions: {}
env:
  SETTINGS_XML: ${{ github.workspace }}/.mvn/settings.xml
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: temurin
jobs:
  performance-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      pandoc:
        image: ghcr.io/schweizerischebundesbahnen/pandoc-service:2.8.0@sha256:187763e095a9f2fda0b41298cd75597a868b8213539c167c34b4675f5caf969f
        ports: [9082:9082]
    env:
      IO_JFROG_SBB_POLARION_TOKEN: ${{ secrets.IO_JFROG_SBB_POLARION_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}  # Providing this prevents reaching the GitHub request limits
      PANDOC_SERVICE_URL: http://localhost:9082
    steps:
      - name: 📄 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: 🧱 Set up JDK and Maven
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: ⏱️ Run the performance tests
        run: mvn --batch-mode -s "${SETTINGS_XML}" verify -P performance-tests-with-pandoc-docker -Dpandoc.service.url="${PANDOC_SERVICE_URL}"
      - name: 📊 Show the table of the run
        if: always()
        run: |
          if [ -f target/surefire-reports/performance-summary.md ]; then
            cat target/surefire-reports/performance-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: 📋 Upload the timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: performance-reports
          path: |
            target/surefire-reports/performance-*.txt
            target/surefire-reports/performance-summary.md
            target/surefire-reports/performance-reference-times.properties
          retention-days: 7
